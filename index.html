<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자리바꾸기</title>
<style>
  html,body{margin:0;height:100%;background:#f5f7fb;font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f7fb}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:#334155;line-height:1.7}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:15px;pointer-events:none;transition:opacity .3s}
  @media (prefers-color-scheme:dark){html,body,#app{background:#0b1020}#msg{color:#cbd5e1}#load{color:#94a3b8}}
</style>
</head>
<body>
<div id="load">불러오는 중...</div>
<div id="msg"></div>
<iframe id="app" title="자리바꾸기" allow="clipboard-write; fullscreen"></iframe>
<script>
  /* ▼▼▼ 여기 한 줄만 바꾸세요: 구글 앱스 스크립트 웹 앱 주소 (https://script.google.com/macros/s/.../exec) ▼▼▼ */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxvVDD2dGk9x1mfbtGQFH_zv4P3nWdLCki8fDqVGrRImmWVvNO3699MUpLk6QNl79YimA/exec';
  /* ▲▲▲ */

  var frame = document.getElementById('app');
  var load = document.getElementById('load');
  var msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(APP_URL)) {
    frame.style.display = 'none';
    load.style.display = 'none';
    msg.style.display = 'flex';
    msg.textContent = 'index.html 안의 APP_URL에 앱스 스크립트 웹 앱 주소(…/exec)를 붙여넣어 주세요.';
  } else {
    frame.addEventListener('load', function () { load.style.opacity = '0'; });
    frame.src = APP_URL;
  }
</script>
</body>
</html>
